let questions = [], current = 0, score = 0, answered = false;
const app = document.getElementById('app');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showStart() {
  app.innerHTML = `
    <div class="start-screen">
      <div class="app-title">3,000 Most Common Words</div>
      <div class="app-sub">With 2,500–3,000 words, you can understand<br>90% of everyday English.<br><br>100問のプールからランダムに10問出題します。</div>
      <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
    </div>
  `;
}

function startQuiz() {
  questions = shuffle(ALL_QUESTIONS).slice(0, 10);
  current = 0; score = 0; answered = false;
  renderQuiz();
}

function renderQuiz() {
  app.innerHTML = `
    <div class="prog-bar"><div class="prog-fill" id="prog" style="width:0%"></div></div>
    <div class="meta" id="meta"></div>
    <div class="question">Which word doesn't belong?</div>
    <div class="options" id="opts"></div>
    <div id="exp-box" style="display:none" class="exp-box"></div>
    <button class="cont-btn" id="cont" style="display:none" onclick="nextQ()">Continue</button>
  `;
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  const words = shuffle(q.words);
  document.getElementById('prog').style.width = (current / 10 * 100) + '%';
  document.getElementById('meta').textContent = 'Question ' + (current + 1) + ' / 10';
  document.getElementById('exp-box').style.display = 'none';
  document.getElementById('cont').style.display = 'none';
  answered = false;
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  words.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="radio"></span>' + w;
    btn.onclick = () => selectAnswer(w);
    opts.appendChild(btn);
  });
}

function selectAnswer(word) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const isCorrect = word === q.answer;
  if (isCorrect) score++;
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    const label = b.textContent.trim();
    if (label === q.answer) b.className = 'opt correct';
    else if (label === word && !isCorrect) b.className = 'opt wrong';
  });
  const box = document.getElementById('exp-box');
  box.style.display = 'block';
  box.innerHTML = `
    <div class="exp-label ${isCorrect ? 'ok' : 'ng'}">${isCorrect ? '✓ Correct!' : '✗ Not quite'}</div>
    <div class="exp-en">${q.en}</div>
    <div class="exp-ja">${q.ja}</div>
  `;
  document.getElementById('cont').style.display = 'block';
}

function nextQ() {
  current++;
  if (current >= 10) {
    app.innerHTML = `
      <div class="prog-bar"><div class="prog-fill" style="width:100%"></div></div>
      <div class="score-box">
        <div class="score-num">${score} / 10</div>
        <div class="score-sub">Quiz complete!</div>
        <button class="retry-btn" onclick="showStart()">Try again</button>
      </div>
    `;
  } else {
    renderQuestion();
  }
}

showStart();
</script>
</body>
</html>
